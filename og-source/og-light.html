<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; }
  body {
    font-family: 'Inter', -apple-system, 'SF Pro Display', 'Helvetica Neue', 'PingFang TC', 'Noto Sans TC', sans-serif;
    background:#fcfcfc; color:#111; position:relative;
    -webkit-font-smoothing: antialiased;
    display:flex; align-items:center; justify-content:center;
  }
  .bg { position:absolute; inset:0;
    background:
      radial-gradient(760px 420px at 50% -18%, rgba(0,0,0,.055), transparent 65%),
      radial-gradient(520px 320px at 100% 118%, rgba(0,0,0,.04), transparent 62%);
  }
  .grid { position:absolute; inset:0; opacity:.55;
    background-image:
      linear-gradient(rgba(0,0,0,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,.035) 1px, transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image: radial-gradient(760px 520px at 50% 45%, #000, transparent 78%);
  }
  .col { position:relative; width:1000px; margin-bottom:26px; text-align:center;
         display:flex; flex-direction:column; align-items:center; }

  .avatar { width:96px; height:96px; border-radius:50%; overflow:hidden;
            box-shadow:0 18px 44px rgba(0,0,0,.16), 0 0 0 5px #fff, 0 0 0 6px rgba(0,0,0,.07); }
  .avatar img { width:100%; height:100%; object-fit:cover; object-position:50% 22%; }

  .pill { margin-top:22px; display:inline-flex; align-items:center; gap:9px;
          padding:8px 18px; border-radius:999px;
          background:#ecfdf5; border:1px solid #a7f3d0; color:#047857;
          font-size:14px; font-weight:700; letter-spacing:.06em; }
  .dot { width:7px; height:7px; border-radius:50%; background:#10b981; }

  h1 { margin-top:24px; font-size:52px; line-height:1.28; font-weight:800; letter-spacing:-.045em;
       background:linear-gradient(135deg,#000 32%, #6a6a6a 100%);
       -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

  .role { margin-top:20px; font-size:20px; font-weight:500; letter-spacing:.02em; color:#8a8a8a; }
  .role strong { color:#111; font-weight:800; letter-spacing:0; }

  .stats { margin-top:30px; display:flex; align-items:center; }
  .stat { padding:0 46px; position:relative; }
  .stat + .stat::before { content:''; position:absolute; left:0; top:8px; bottom:8px; width:1px; background:#e4e4e4; }
  .stat .n { font-size:40px; font-weight:800; letter-spacing:-.04em; line-height:1; color:#0f0f0f; }
  .stat .l { margin-top:10px; font-size:12px; font-weight:700; letter-spacing:.22em; color:#9b9b9b; }

  .brands { position:absolute; left:0; right:0; bottom:34px; text-align:center;
            font-size:14px; font-weight:700; letter-spacing:.19em; color:#b4b4b4; }
  .brands b { font-weight:400; padding:0 7px; color:#d5d5d5; }

  .tag { position:absolute; left:52px; top:44px; font-size:11.5px; font-weight:800;
         letter-spacing:.3em; color:#c0c0c0; }
  .tag2 { position:absolute; right:52px; top:44px; font-size:11.5px; font-weight:800;
          letter-spacing:.3em; color:#c0c0c0; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="grid"></div>

  <div class="tag">MEDIA KIT</div>
  <div class="tag2">2026</div>

  <div class="col">
    <div class="avatar"><img src="../profile.jpg"></div>

    <span class="pill"><span class="dot"></span>目前開放品牌合作邀約</span>

    <h1>用真實感敘事，<br>為品牌創造深度的社群共鳴</h1>

    <div class="role"><strong>NEO</strong>　短影音創作者 ｜ 品牌敘事 ｜ 陌生連結所主理人</div>

    <div class="stats">
      <div class="stat"><div class="n">700萬+</div><div class="l">全平台觀看</div></div>
      <div class="stat"><div class="n">60+</div><div class="l">品牌合作案例</div></div>
      <div class="stat"><div class="n">3</div><div class="l">IG / TT / YT</div></div>
    </div>
  </div>

  <div class="brands">SONY<b>·</b>SUDIO<b>·</b>GRAVASTAR<b>·</b>CUPETIT<b>·</b>GOGOOUT<b>·</b>萬國滷味</div>
</body>
</html>
